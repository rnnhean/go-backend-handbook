openapi: 3.0.3
info:
  title: Mini Coin API
  version: 1.0.0
  license:
    name: MIT
    url: https://opensource.org/license/MIT
  description: 虚构充值服务，用于后端教学；不包含任何真实公司或业务信息。
servers:
  - url: http://127.0.0.1:8081
paths:
  /v1/recharges:
    post:
      summary: 创建充值订单
      operationId: createRecharge
      description: |
        首次创建一个 req_id 返回 201 Created；同一个 req_id 且请求参数一致时，
        返回首次结果并标记 duplicated=true，HTTP 状态为 200 OK。
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          description: 客户端追踪 ID；缺失或超过 64 字符时由服务端生成。
          schema:
            type: string
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeRequest'
            example:
              req_id: demo-1
              amount_cent: 10
              channel: manual
      responses:
        '201':
          description: 首次创建成功
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'
              example:
                code: OK
                message: success
                request_id: trace-demo-001
                data:
                  uid: u-1001
                  balance: 110
                  duplicated: false
        '200':
          description: 幂等命中，请求参数与首次请求一致
          headers:
            X-Request-Id:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'
              example:
                code: OK
                message: success
                request_id: trace-demo-002
                data:
                  uid: u-1001
                  balance: 110
                  duplicated: true
        '202':
          description: 相同 req_id 的首次请求仍在处理中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: JSON、金额、req_id 或 channel 不合法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: 未提供 Bearer token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '405':
          description: HTTP 方法不是 POST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 账户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 幂等键冲突、账户冻结或原请求已失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: 内部错误；响应不会泄漏 SQL、堆栈或依赖地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RechargeRequest:
      type: object
      additionalProperties: false
      required: [req_id, amount_cent, channel]
      properties:
        req_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 客户端生成，并在重试时原样复用。
        amount_cent:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000000
          description: 充值金额，单位是分；字段名自带单位。
        channel:
          type: string
          enum: [manual, coupon]
    RechargeResponse:
      type: object
      required: [code, message, request_id, data]
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        request_id:
          type: string
        data:
          type: object
          required: [uid, balance, duplicated]
          properties:
            uid:
              type: string
              example: u-1001
            balance:
              type: integer
              format: int64
              description: 充值后的可用余额，单位是分。
            duplicated:
              type: boolean
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          enum:
            - UNAUTHORIZED
            - INVALID_JSON
            - INVALID_AMOUNT
            - INVALID_REQ_ID
            - INVALID_CHANNEL
            - MISSING_REQ_ID
            - MISSING_CHANNEL
            - REQ_ID_CONFLICT
            - PROCESSING
            - PREVIOUSLY_FAILED
            - ACCOUNT_NOT_FOUND
            - ACCOUNT_FROZEN
            - METHOD_NOT_ALLOWED
            - INTERNAL_ERROR
        message:
          type: string
          description: 给人阅读的稳定说明，客户端逻辑不能依赖具体文案。
        request_id:
          type: string
